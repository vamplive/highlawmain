# CI — 테스트 + 빌드 검증
# 배포는 deploy.yml의 Deploy to Lightsail 워크플로에서 수행한다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  backend-lint:
    name: backend / eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-test:
    name: backend / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-lint:
    name: frontend / eslint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-build:
    name: frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
