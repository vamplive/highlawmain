# [버그 수정] /uploads/* 정적 파일이 항상 깨져 보이는 문제 — nginx가 백엔드를 거치지 않고
# 자체적으로 /uploads 를 정적 서빙하면서, Node 백엔드의 STORAGE_PATH 와 다른 디렉터리를
# 보고 있어 파일을 찾지 못하고 404/403을 반환하던 것이 원인이었음.
#
# 적용 방법:
#   1) 기존 server { ... } 블록 안에서 "location /uploads" (또는 "location ^~ /uploads",
#      alias/root 로 정적 파일을 직접 서빙하는 블록)을 찾아 삭제하고, 아래 블록으로 교체한다.
#      (보통 /etc/nginx/sites-available/highlaw.co.kr 또는 highlaw.conf 에 있음 — 정확한
#       파일 위치는 `sudo nginx -T 2>/dev/null | grep -n "location /uploads" -B2 -A6` 로 확인)
#   2) /api 와 동일하게 Node 백엔드(포트 5001)로 프록시하도록 바꾼다 — 이렇게 하면
#      백엔드가 항상 자신이 파일을 "쓴" 바로 그 STORAGE_PATH 에서 "읽어" 서빙하므로,
#      향후 STORAGE_PATH 가 바뀌어도(예: 외부 스토리지로 이전) nginx 설정을 별도로
#      맞출 필요 없이 항상 일치한다.
#   3) 적용 후 검증: `sudo nginx -t && sudo systemctl reload nginx`
#
# proxy_pass 대상 포트(5001)는 backend/index.js 의 기본 포트와 동일해야 한다.
# 이미 /api 에 대해 동일한 proxy_pass 블록이 있다면 그 호스트:포트를 그대로 맞춘다.

location /uploads/ {
    proxy_pass         http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# ── 대안: 위 프록시 방식 대신, nginx가 계속 직접 정적 서빙을 하길 원한다면 ──
# (백엔드 .env 의 STORAGE_PATH 값과 반드시 동일한 경로를 가리켜야 한다. 두 값이
#  어긋나는 순간 이번과 같은 문제가 다시 발생하므로, 위의 프록시 방식이 더 안전하다.)
#
# location /uploads/ {
#     alias /home/ubuntu/highlawmain/backend/data/uploads/;   # ← backend/.env 의 STORAGE_PATH/uploads 와 반드시 일치시킬 것
#     access_log off;
#     expires 30d;
# }
#
# 실제 적용된 서버 경로 (2026-06-07 확인):
#   STORAGE_PATH=/home/ubuntu/highlawmain/backend/data  (backend/.env)
#   → 업로드 파일 실제 위치: /home/ubuntu/highlawmain/backend/data/uploads/
#   → nginx alias 를 위 경로로 수정하여 해결
