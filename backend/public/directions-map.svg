<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#00000015"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c8a97e"/>
    </marker>
  </defs>

  <rect width="840" height="540" fill="#f5f3ef" rx="8"/>

  <!-- 타이틀 바 -->
  <rect x="0" y="0" width="840" height="46" fill="#0f1d32" rx="8"/>
  <rect x="0" y="34" width="840" height="16" fill="#0f1d32"/>
  <text x="420" y="30" text-anchor="middle" fill="#c8a97e" font-size="13" font-weight="500" letter-spacing="3">오시는 길 — 역삼역 4번 출구 도보 약 1분 (100m 직진)</text>

  <!-- ============================================================ -->
  <!-- 도로 레이아웃 (역삼역 사거리 기준)                               -->
  <!-- ============================================================ -->

  <!-- 테헤란로 (동서 대로) — 가로로 지나는 넓은 메인 도로 -->
  <rect x="20" y="240" width="800" height="54" fill="#e5e2db" rx="2"/>
  <line x1="20" y1="267" x2="820" y2="267" stroke="#d6d2ca" stroke-width="1.2" stroke-dasharray="14,8"/>
  <text x="490" y="272" text-anchor="middle" fill="#aaa" font-size="10" font-weight="500" letter-spacing="8">테 헤 란 로</text>
  <text x="40" y="258" fill="#c0bcb5" font-size="8">← 강남역 방면</text>
  <text x="750" y="258" fill="#c0bcb5" font-size="8">선릉역 방면 →</text>

  <!-- 논현로 (남북 도로) — 역삼역 사거리를 형성하는 남북 도로 -->
  <rect x="180" y="60" width="54" height="420" fill="#eae7e1" rx="2"/>
  <line x1="207" y1="60" x2="207" y2="480" stroke="#d6d2ca" stroke-width="1.2" stroke-dasharray="14,8"/>
  <text x="212" y="120" text-anchor="middle" fill="#aaa" font-size="9" font-weight="500" letter-spacing="4" transform="rotate(90, 212, 120)">논 현 로</text>
  <text x="212" y="80" text-anchor="middle" fill="#c0bcb5" font-size="7">↑ 학동역 방면</text>
  <text x="212" y="460" text-anchor="middle" fill="#c0bcb5" font-size="7">한티역 방면 ↓</text>

  <!-- 2호선 지하철 노선 가이드 라인 (연한 녹색 투명) -->
  <line x1="20" y1="290" x2="820" y2="290" stroke="#22B14C" stroke-width="3.5" opacity="0.15"/>

  <!-- ============================================================ -->
  <!-- 주변 건물 및 주요 랜드마크 배치                                  -->
  <!-- ============================================================ -->

  <!-- 역삼역 사거리 코너 건물들 -->
  <!-- 북서쪽 코너 (강남역/학동 방면) -->
  <rect x="40" y="80" width="120" height="90" fill="#ddd9d2" rx="4" filter="url(#sh)"/>
  <text x="100" y="125" text-anchor="middle" fill="#b8b3ab" font-size="9" font-weight="500">강남N타워</text>

  <!-- 남서쪽 코너 (강남역/한티 방면) -->
  <rect x="40" y="315" width="120" height="90" fill="#ddd9d2" rx="4" filter="url(#sh)"/>
  <text x="100" y="360" text-anchor="middle" fill="#b8b3ab" font-size="9" font-weight="500">역삼금융센터</text>

  <!-- 남동쪽 코너 (선릉역/한티 방면) -->
  <rect x="250" y="315" width="150" height="90" fill="#ddd9d2" rx="4" filter="url(#sh)"/>
  <text x="325" y="355" text-anchor="middle" fill="#b8b3ab" font-size="9" font-weight="500">아세아타워</text>
  <text x="325" y="370" text-anchor="middle" fill="#c8c3bb" font-size="7.5">신한은행 역삼역지점</text>

  <!-- 포스코타워 역삼 (사거리 남동쪽 대형 랜드마크) -->
  <rect x="420" y="315" width="160" height="90" fill="#cfcac1" rx="4" filter="url(#sh)"/>
  <text x="500" y="360" text-anchor="middle" fill="#9f9990" font-size="9.5" font-weight="500">포스코타워 역삼</text>

  <!-- 북동쪽 코너 (선릉역/학동 방면) — 하이로 방향 라인 주요 건물들 -->
  <!-- 역삼역 4번출구 바로 앞 건물 -->
  <rect x="250" y="160" width="90" height="60" fill="#ddd9d2" rx="3" filter="url(#sh)"/>
  <text x="295" y="195" text-anchor="middle" fill="#c5c0b8" font-size="8">글래스타워</text>

  <!-- 4번 출구에서 직진 시 지나치는 건물 (신한금융) -->
  <rect x="360" y="160" width="100" height="60" fill="#ddd9d2" rx="3" filter="url(#sh)"/>
  <text x="410" y="195" text-anchor="middle" fill="#c5c0b8" font-size="8">신한투자증권 빌딩</text>

  <!-- ★★★ 역삼KR빌딩 (법무법인 하이로 15층) ★★★ -->
  <g>
    <rect x="480" y="145" width="190" height="75" fill="#0f1d32" rx="5" stroke="#c8a97e" stroke-width="1" filter="url(#sh)"/>
    <rect x="492" y="160" width="4" height="18" fill="#c8a97e" rx="1"/>
    <rect x="500" y="154" width="4" height="24" fill="#c8a97e" rx="1"/>
    <rect x="508" y="162" width="4" height="16" fill="#c8a97e" rx="1"/>
    
    <text x="590" y="176" fill="#c8a97e" font-size="11" font-weight="700">법무법인 하이로</text>
    <text x="590" y="193" fill="rgba(255,255,255,0.85)" font-size="8.5" font-weight="500">역삼KR빌딩 15층</text>
    <text x="590" y="206" fill="rgba(255,255,255,0.45)" font-size="7">(1층에 스타벅스 입점)</text>
  </g>

  <!-- 테헤란로 141 (스타벅스 옆 빌딩 표기) -->
  <rect x="685" y="160" width="100" height="60" fill="#ddd9d2" rx="3" filter="url(#sh)"/>
  <text x="735" y="195" text-anchor="middle" fill="#c5c0b8" font-size="8">태왕빌딩</text>

  <!-- ============================================================ -->
  <!-- 역삼역 지하철 및 출구 표시                                       -->
  <!-- ============================================================ -->

  <!-- 역삼역 표시 (사거리 중앙) -->
  <g transform="translate(180, 240)">
    <!-- 지하철역 상징 원형 배지 -->
    <rect width="54" height="54" fill="#22B14C" rx="27" opacity="0.1"/>
    <circle cx="27" cy="27" r="14" fill="#22B14C" filter="url(#sh)"/>
    <text x="27" cy="31" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">역삼</text>
  </g>
  <text x="207" y="312" text-anchor="middle" fill="#777" font-size="9.5" font-weight="600">역삼역 (2호선)</text>

  <!-- 출구 마커 배치 -->
  <!-- 5번 출구 (북서쪽) -->
  <circle cx="165" cy="225" r="7" fill="#22B14C" opacity="0.6"/>
  <text x="165" y="228" text-anchor="middle" fill="#fff" font-size="7" font-weight="600">5</text>

  <!-- 6번 출구 (남서쪽) -->
  <circle cx="165" cy="310" r="7" fill="#22B14C" opacity="0.6"/>
  <text x="165" y="313" text-anchor="middle" fill="#fff" font-size="7" font-weight="600">6</text>

  <!-- 3번 출구 (남동쪽) -->
  <circle cx="250" cy="310" r="7" fill="#22B14C" opacity="0.6"/>
  <text x="250" y="313" text-anchor="middle" fill="#fff" font-size="7" font-weight="600">3</text>

  <!-- 2번 출구 (남동쪽 더 오른쪽) -->
  <circle cx="340" cy="310" r="7" fill="#22B14C" opacity="0.6"/>
  <text x="340" y="313" text-anchor="middle" fill="#fff" font-size="7" font-weight="600">2</text>

  <!-- ★ 4번 출구 (추천 출구 - 북동쪽 코너) -->
  <g>
    <circle cx="250" cy="225" r="11" fill="#c8a97e" filter="url(#sh)"/>
    <text x="250" y="229" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">4</text>
  </g>
  <text x="250" y="208" text-anchor="middle" fill="#c8a97e" font-size="7.5" font-weight="600">역삼역 4번출구</text>

  <!-- ============================================================ -->
  <!-- 도보 길찾기 경로 (4번 출구 → 역삼KR빌딩 법무법인 하이로)            -->
  <!-- ============================================================ -->
  
  <!-- 4번 출구에서 나와 테헤란로 인도(Sidewalk)를 따라 100m 직진 후 KR빌딩 진입 -->
  <path
    d="M 261 225 L 485 225 L 485 221"
    fill="none"
    stroke="#c8a97e"
    stroke-width="4.5"
    stroke-dasharray="10,6"
    stroke-linecap="round"
    stroke-linejoin="round"
    marker-end="url(#ag)"
    opacity="0.95"
  />

  <!-- 도보 경로 배지 -->
  <rect x="325" y="200" width="95" height="18" fill="#c8a97e" rx="9" filter="url(#sh)"/>
  <text x="372.5" y="212" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="600">도보 약 1분 (100m)</text>

  <!-- 스타벅스 아이콘 위치 표기 (1층 입점 랜드마크) -->
  <circle cx="510" cy="225" r="5" fill="#006241"/>
  <text x="520" y="228" fill="#006241" font-size="8" font-weight="600">스타벅스 (KR빌딩 1층)</text>

  <!-- ============================================================ -->
  <!-- 지도 하단 상세 범례 & 주소 명판                                   -->
  <!-- ============================================================ -->
  <g transform="translate(40, 470)">
    <rect width="760" height="46" fill="#fff" rx="6" stroke="rgba(0,0,0,0.06)" stroke-width="1.2" filter="url(#sh)"/>

    <!-- 지하철 출구 범례 -->
    <circle cx="24" cy="23" r="5.5" fill="#22B14C" opacity="0.6"/>
    <text x="35" y="26" fill="#777" font-size="8.5" font-weight="500">2호선 출구</text>

    <!-- 추천 출구 범례 -->
    <circle cx="114" cy="23" r="7.5" fill="#c8a97e"/>
    <text x="114" y="26" text-anchor="middle" fill="#fff" font-size="7.5" font-weight="700">4</text>
    <text x="127" y="26" fill="#777" font-size="8.5" font-weight="500">추천 출구</text>

    <!-- 도보선 범례 -->
    <line x1="205" y1="23" x2="235" y2="23" stroke="#c8a97e" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="242" y="26" fill="#777" font-size="8.5" font-weight="500">도보 이동 경로</text>

    <!-- 하이로 빌딩 범례 -->
    <rect x="335" y="16" width="13" height="13" fill="#0f1d32" rx="2" stroke="#c8a97e" stroke-width="0.8"/>
    <text x="355" y="26" fill="#0f1d32" font-size="8.5" font-weight="600">법무법인 하이로 (역삼KR빌딩 15층)</text>

    <!-- 상세 주소 안내 -->
    <text x="590" y="26" fill="#888" font-size="8.5" font-weight="500">서울 강남구 테헤란로 141 (역삼동 642-16) 15층</text>
  </g>
</svg>
